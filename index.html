<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>

<div class="auth-screen" id="auth-screen" style="display:none">
  <div><div class="auth-logo">TL</div><h1 style="font-size:20px;font-family:var(--sans)">Training Log</h1><p style="color:var(--muted);font-size:14px;margin-top:4px">Sign in or create an account</p></div>
  <div style="display:flex;flex-direction:column;gap:8px;width:280px">
    <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    <input type="password" id="auth-pass" placeholder="password" autocomplete="current-password">
    <button class="btn btn-primary" style="padding:12px;font-size:14px;margin-top:4px" id="auth-signin-btn">Sign in</button>
    <button class="btn" style="padding:10px;font-size:13px" id="auth-signup-btn">Create account</button>
    <div id="auth-msg" style="font-size:12px;color:var(--muted);text-align:center;min-height:16px"></div>
  </div>
</div>

<div class="app" id="main-app" style="display:none">
  <div class="topbar">
    <div class="topbar-inner">
      <span style="font-family:var(--mono);font-size:15px;color:var(--green);font-weight:500">TL</span>
      <div class="btn-group">
        <button class="btn btn-sm" id="signout-btn" style="color:var(--muted)">Sign out</button>
      </div>
    </div>
    <nav id="tab-nav">
      <button class="active" data-tab="log">Log</button>
      <button data-tab="history">History</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="library">Library</button>
    </nav>
  </div>

  <div id="tab-log" class="tab content" style="display:block"></div>
  <div id="tab-history" class="tab content" style="display:none"></div>
  <div id="tab-progress" class="tab content" style="display:none"></div>
  <div id="tab-library" class="tab content" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
